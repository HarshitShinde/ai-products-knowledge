<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive ML Map (Interactive Decision Matrix)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B132B;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(96, 165, 250, 0.5);
            --glass-border-selected: #60A5FA;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent: #60A5FA;
            --accent-glow: rgba(96, 165, 250, 0.4);
            --good-bg: rgba(6, 78, 59, 0.5);
            --good-text: #34d399;
            --bad-bg: rgba(127, 29, 29, 0.5);
            --bad-text: #f87171;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background: radial-gradient(circle at top right, #1e3a8a 0%, #0B132B 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
        }

        header {
            padding: 30px 5% 15px;
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 8px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Breadcrumb Bar */
        .breadcrumb-bar {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 5%;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .breadcrumb-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .breadcrumb-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .breadcrumb-item.active {
            background: rgba(96, 165, 250, 0.15);
            border-color: var(--accent);
            color: white;
        }

        .breadcrumb-separator {
            color: var(--text-muted);
            font-size: 1.2rem;
            line-height: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 90%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .question-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 600;
        }

        .question-desc {
            color: var(--text-muted);
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
        }

        /* Compact Options Grid */
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
        }

        .option-chip {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
        }

        .option-chip:hover {
            border-color: var(--glass-border-hover);
            background: rgba(45, 60, 85, 0.8);
            transform: translateY(-2px);
        }

        .option-chip.selected {
            border-color: var(--glass-border-selected);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 15px var(--accent-glow);
            background: rgba(30, 58, 138, 0.5);
            transform: translateY(-2px);
        }

        .option-chip.unselected {
            opacity: 0.5;
            border-color: transparent;
            background: rgba(15, 23, 42, 0.4);
        }
        
        .option-chip.unselected:hover {
            opacity: 0.8;
        }

        .option-icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        .option-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: white;
            white-space: nowrap;
        }

        /* Option Detail Area */
        .option-detail-area {
            width: 100%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .option-detail-desc {
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            text-align: center;
        }

        .use-case-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        .use-case-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .use-case-tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        /* Results Layout */
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 10px;
        }

        .result-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border-selected);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .alg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .alg-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .alg-usecase {
            color: var(--accent);
            font-style: italic;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.5;
            padding-left: 10px;
            border-left: 3px solid var(--accent);
        }

        .executive-fit {
            background: rgba(96, 165, 250, 0.12);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
            color: #dbeafe;
            font-size: 0.92rem;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        .decision-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .decision-fact {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
            min-width: 0;
        }

        .decision-label {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .decision-value {
            color: #e2e8f0;
            font-size: 0.88rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .pros-cons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            flex-grow: 1;
        }

        .pc-section {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .metrics-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }

        .metric-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .metric-tag {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge.good { background-color: var(--good-bg); color: var(--good-text); }
        .badge.bad { background-color: var(--bad-bg); color: var(--bad-text); }

        ul {
            margin: 0;
            padding-left: 20px;
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        li { margin-bottom: 6px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .results-container { grid-template-columns: 1fr; }
            .decision-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            .question-title { font-size: 1.5rem; }
            .option-chip { padding: 8px 12px; }
            .option-title { font-size: 0.85rem; }
        }
    </style>
</head>

        // State Machine
        // Array of selected IDs representing the path
        let state = [];

        // DOM Handles
        const breadcrumbBar = document.getElementById('breadcrumb-bar');
        const treeContainer = document.getElementById('tree-container');

        function navigateBack(levelIndex) {
            if (levelIndex === -1) {
                // Clicked root "Start"
                state = [];
            } else {
                // Clicked a specific breadcrumb, slice the state array to keep up to that point
                state = state.slice(0, levelIndex + 1);
            }
            render();
        }

        function handleSelect(id) {
            // Find current node to know what level we are at conceptually
            // Actually, we just push the selection to state.
            state.push(id);
            render();
        }

        function renderBreadcrumbs() {
            let html = `<div class="breadcrumb-item ${state.length === 0 ? 'active' : ''}" onclick="navigateBack(-1)">
                🏠 Start
            </div>`;

            let currentData = treeData.root;
            
            for (let i = 0; i < state.length; i++) {
                const selectedId = state[i];
                let selectedOption = null;
                
                // Find the option in the current data
                if (currentData && currentData.options) {
                    selectedOption = currentData.options.find(opt => opt.id === selectedId);
                }

                if (selectedOption) {
                    html += `<div class="breadcrumb-separator">›</div>`;
                    const isActive = (i === state.length - 1);
                    html += `<div class="breadcrumb-item ${isActive ? 'active' : ''}" onclick="navigateBack(${i})">
                        ${selectedOption.icon} ${selectedOption.title}
                    </div>`;
                    
                    // Move currentData pointer deeper if there's a sub-tree
                    currentData = treeData[selectedId];
                } else {
                    // It's a leaf node (algorithm list), breadcrumb ends here conceptually
                    // Let's get the title from the previous level's option search
                    // The algorithm ID itself is selectedId
                    let prevData = i === 0 ? treeData.root : treeData[state[i-1]];
                    if (prevData && prevData.options) {
                        selectedOption = prevData.options.find(opt => opt.id === selectedId);
                        if (selectedOption) {
                            html += `<div class="breadcrumb-separator">›</div>`;
                            const isActive = (i === state.length - 1);
                            html += `<div class="breadcrumb-item ${isActive ? 'active' : ''}" onclick="navigateBack(${i})">
                                ${selectedOption.icon} ${selectedOption.title}
                            </div>`;
                        }
                    }
                }
            }

            breadcrumbBar.innerHTML = html;
            // Scroll breadcrumbs to end automatically if they overflow
            breadcrumbBar.scrollLeft = breadcrumbBar.scrollWidth;
        }

        function renderCurrentLevel() {
            let html = '';
            
            // Determine the current node ID based on state
            let currentNodeId = 'root';
            if (state.length > 0) {
                currentNodeId = state[state.length - 1];
            }

            // Check if it's a results node (leaf)
            if (resultsData[currentNodeId]) {
                const items = resultsData[currentNodeId];
                
                // We should also find the selected option to display its use cases nicely at the top
                let parentId = state.length > 1 ? state[state.length - 2] : 'root';
                let selectedOption = treeData[parentId].options.find(opt => opt.id === currentNodeId);
                
                html += `
                    <div class="animate-fade-in" style="width: 100%;">
                        <h2 class="question-title">${selectedOption ? selectedOption.title : 'Recommended Algorithms'}</h2>
                        <p class="question-desc">${selectedOption ? selectedOption.desc : 'Explore the methods below to solve your business problem.'}</p>
                `;

                if (selectedOption && selectedOption.useCases && selectedOption.useCases.length > 0) {
                    html += `<div class="use-case-label">Business Applications</div>
                             <div class="use-case-tags" style="margin-bottom: 30px;">`;
                    selectedOption.useCases.forEach(uc => {
                        html += `<div class="use-case-tag">${uc}</div>`;
                    });
                    html += `</div>`;
                }

                html += `<div class="results-container">`;

                items.forEach(item => {
                    const bestUseCase = item.bestUseCase || item.usecase || 'Explore the method below to assess fit.';
                    const decisionFacts = [
                        ["Type", item.type],
                        ["Core Logic", item.coreLogic],
                        ["Assumptions", item.assumptions],
                        ["Avoid When", item.whenNotToUse],
                        ["Real-World Example", item.realWorldExample]
                    ].filter(([, value]) => value);
                    let factsList = decisionFacts.map(([label, value]) => `
                        <div class="decision-fact">
                            <div class="decision-label">${label}</div>
                            <div class="decision-value">${value}</div>
                        </div>
                    `).join('');
                    let prosList = item.good ? item.good.map(i => `<li>${i}</li>`).join('') : '';
                    let consList = item.bad ? item.bad.map(i => `<li>${i}</li>`).join('') : '';
                    let metricsList = item.metrics ? item.metrics.map(m => `<div class="metric-tag">${m}</div>`).join('') : '';

                    html += `
                        <div class="result-card">
                            <div class="alg-header">
                                <span class="alg-title">${item.name}</span>
                            </div>
                            <div class="alg-usecase">🎯 Best for: ${bestUseCase}</div>
                            ${item.executiveFit ? `<div class="executive-fit">${item.executiveFit}</div>` : ''}
                            ${factsList ? `<div class="decision-grid">${factsList}</div>` : ''}
                            
                            <div class="pros-cons">
                                <div class="pc-section">
                                    <span class="badge good">✓ PROS</span>
                                    <ul>${prosList}</ul>
                                </div>
                                <div class="pc-section">
                                    <span class="badge bad">✕ RISKS</span>
                                    <ul>${consList}</ul>
                                </div>
                            </div>
                            ${metricsList ? `
                            <div class="metrics-section">
                                <span class="badge" style="background: rgba(255,255,255,0.1); color: #cbd5e1; margin-bottom: 5px;">📊 Key Performance Metrics</span>
                                <div class="metric-tags">${metricsList}</div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += `</div></div>`;
            } else if (treeData[currentNodeId]) {
                // It's a question node
                const data = treeData[currentNodeId];
                
                html += `
                    <div class="animate-fade-in" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                        <h2 class="question-title">${data.question}</h2>
                        <p class="question-desc">${data.desc}</p>
                        
                        <div class="options-grid">
                `;

                data.options.forEach(opt => {
                    // Use onmouseover to show details if we want, or just a simple click handler
                    // Let's implement click to select
                    html += `
                        <div class="option-chip" onclick="handleSelect('${opt.id}')" onmouseenter="showDetail('${opt.id}')" onmouseleave="hideDetail()">
                            <div class="option-icon">${opt.icon}</div>
                            <div class="option-title">${opt.title}</div>
                        </div>
                    `;
                });

                html += `</div>`;

                // Subtitle Area for hovered option details
                html += `
                    <div id="option-detail-panel" class="option-detail-area" style="opacity: 0; transition: opacity 0.3s; pointer-events: none;">
                        <div id="option-detail-desc" class="option-detail-desc"></div>
                        <div class="use-case-label">Business Applications</div>
                        <div id="option-detail-usecases" class="use-case-tags"></div>
                    </div>
                `;

                html += `</div>`;
            }

            treeContainer.innerHTML = html;
        }

        // We store options globally for the hover effect lookup
        function getOptionById(id) {
            let currentNodeId = 'root';
            if (state.length > 0) {
                currentNodeId = state[state.length - 1];
            }
            if (treeData[currentNodeId] && treeData[currentNodeId].options) {
                return treeData[currentNodeId].options.find(opt => opt.id === id);
            }
            return null;
        }

        window.showDetail = function(id) {
            const panel = document.getElementById('option-detail-panel');
            const desc = document.getElementById('option-detail-desc');
            const usecases = document.getElementById('option-detail-usecases');
            
            if (!panel || !desc || !usecases) return;

            const opt = getOptionById(id);
            if (opt) {
                desc.textContent = opt.desc;
                usecases.innerHTML = '';
                if (opt.useCases && opt.useCases.length > 0) {
                    opt.useCases.forEach(uc => {
                        usecases.innerHTML += `<div class="use-case-tag">${uc}</div>`;
                    });
                }
                panel.style.opacity = '1';
            }
        };

        window.hideDetail = function() {
            const panel = document.getElementById('option-detail-panel');
            if (panel) {
                panel.style.opacity = '0';
            }
        };

        function render() {
            renderBreadcrumbs();
            renderCurrentLevel();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initial Render
        render();

    </script>
